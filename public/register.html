<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCF Finance — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #222536;
            --border: #2e3248; --primary: #6366f1; --primary-hover: #5457d4;
            --text: #f1f5f9; --text-muted: #8892a4;
            --danger: #ef4444; --success: #10b981; --radius: 14px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
        .auth-container { width: 100%; max-width: 500px; }
        .brand { display: flex; align-items: center; gap: 0.75rem; justify-content: center; margin-bottom: 2rem; }
        .brand-logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; }
        .brand h1 { font-size: 1.5rem; font-weight: 700; }
        .brand span { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
        .auth-card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem; }
        .auth-card p { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 1.1rem; }
        label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem; color: var(--text-muted); }
        .input-wrap { position: relative; }
        input, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--primary); }
        input.has-toggle { padding-right: 3rem; }
        select option { background: var(--surface2); }
        .toggle-pass { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; }
        .toggle-pass:hover { color: var(--text); }
        .btn-primary { width: 100%; background: var(--primary); color: #fff; border: none; padding: 0.8rem; border-radius: 10px; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: background 0.2s, opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
        .alert-error  { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success{ background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
        .auth-link { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem; }
        .auth-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .auth-link a:hover { text-decoration: underline; }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pass-req { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="brand">
        <div class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
            </svg>
        </div>
        <div><h1>KCF Finance</h1><span>Budget & Expense Manager</span></div>
    </div>

    <div class="auth-card">
        <h2>Create your account</h2>
        <p>Register your organisation to start managing finances</p>

        <div id="alert-box" class="alert"></div>

        <form id="register-form" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Organisation Name *</label>
                    <input type="text" id="name" placeholder="e.g. Grace Church" required>
                </div>
                <div class="form-group">
                    <label for="type">Organisation Type *</label>
                    <select id="type" required>
                        <option value="">Select type…</option>
                        <option value="Church">Church</option>
                        <option value="NGO">NGO</option>
                        <option value="Orphanage">Orphanage</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Street, City">
                </div>
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="text" id="contact" placeholder="+91 98765 43210">
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="admin@yourorg.com" required autocomplete="email">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="Min. 8 characters" class="has-toggle" required autocomplete="new-password">
                        <button type="button" class="toggle-pass" onclick="togglePass('password', this)" aria-label="Toggle">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="pass-req">At least 8 characters</p>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm Password *</label>
                    <div class="input-wrap">
                        <input type="password" id="confirm" placeholder="Re-enter password" class="has-toggle" required autocomplete="new-password">
                        <button type="button" class="toggle-pass" onclick="togglePass('confirm', this)" aria-label="Toggle">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="reg-btn">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">Create Account</span>
            </button>
        </form>

        <div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
</div>

<script>
    // Redirect if already authenticated
    fetch('/api/auth/me', { credentials: 'include' })
        .then(r => r.json())
        .then(d => { if (d.authenticated) window.location.replace('/'); })
        .catch(() => {});

    function togglePass(id, btn) {
        const inp = document.getElementById(id);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        btn.querySelector('svg').style.opacity = inp.type === 'text' ? '0.5' : '1';
    }

    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alert-box');
        box.textContent = msg;
        box.className = `alert alert-${type}`;
        box.style.display = 'block';
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-btn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');

        const name = document.getElementById('name').value.trim();
        const type = document.getElementById('type').value;
        const address = document.getElementById('address').value.trim();
        const contact = document.getElementById('contact').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        // Client-side validation
        if (!name) { showAlert('Organisation name is required.'); return; }
        if (!type) { showAlert('Please select an organisation type.'); return; }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('A valid email address is required.'); return; }
        if (!password || password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
        if (password !== confirm) { showAlert('Passwords do not match.'); return; }

        btn.disabled = true;
        spinner.style.display = 'block';
        btnText.textContent = 'Creating account…';
        document.getElementById('alert-box').style.display = 'none';

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ name, type, address, contact, email, password, confirmPassword: confirm })
            });
            const data = await res.json();
            if (res.ok) {
                showAlert('Account created! Redirecting to your dashboard…', 'success');
                setTimeout(() => window.location.replace('/'), 1000);
            } else {
                showAlert(data.error || 'Registration failed. Please try again.');
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Create Account';
            }
        } catch (err) {
            showAlert('Network error. Please check your connection.');
            btn.disabled = false;
            spinner.style.display = 'none';
            btnText.textContent = 'Create Account';
        }
    });
</script>
</body>
</html>
